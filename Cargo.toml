[package]
name = "rustedge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A GPUI Dynamic Edge overlay that sits at the top of the primary display."
publish = false

[lib]
name = "rustedge"
path = "src/lib.rs"

[[bin]]
name = "rustedge"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.8"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
  ] }
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Data_Xml_Dom",
    "ApplicationModel",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }
windows-core = "0.62"
windows-implement = "0.60"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
smallvec = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }

[dev-dependencies]
gpui = { version = "=0.3.9", package = "gpui-pre", features = ["test-support"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
